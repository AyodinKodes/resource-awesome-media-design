name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  awesome-lint:
    name: awesome-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npx --yes awesome-lint@2.3.0
        env:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  link-check:
    name: link-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --cache --max-cache-age 1d
            --timeout 30 --max-retries 3 --retry-wait-time 5
            --accept '200..=299,403,429'
            README.md contributing.md
          fail: true
